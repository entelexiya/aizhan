<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141311">
  <title>Объекты — управление</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8v84M8 50h84M20 20l60 60M80 20 20 80' stroke='%23ff7a2f' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root { --bg:#141311; --panel:#1c1b18; --line:#34312b; --text:#f2eee6; --muted:#a39d92; --accent:#ff7a2f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 'Manrope', Arial, sans-serif; }
    .wrap { width:min(1000px, calc(100% - 32px)); margin-inline:auto; padding-block:28px 60px; }
    h1 { font:600 30px/1.2 'Oswald', sans-serif; letter-spacing:.5px; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:13px; margin:0 0 28px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    input, select { width:100%; background:#100f0e; color:var(--text); border:1px solid #4a453d; border-radius:0; padding:12px; font:15px 'Manrope', Arial, sans-serif; }
    input:focus { outline:2px solid var(--accent); outline-offset:-2px; }
    button { font:700 14px 'Manrope', Arial, sans-serif; cursor:pointer; border:0; padding:14px 20px; background:var(--accent); color:var(--bg); }
    button:hover { background:#ff9d5c; }
    button.ghost { background:transparent; color:var(--text); border:1px solid #4a453d; }
    button.ghost:hover { background:#272420; }
    button.danger { background:transparent; color:#ff8f6b; border:1px solid #5c3a2c; }
    button:disabled { opacity:.5; cursor:default; }

    .login { max-width:380px; }
    .login button { width:100%; margin-top:14px; }

    .card { border:1px solid var(--line); background:var(--panel); padding:20px; margin-bottom:18px; }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .card-top strong { font:600 20px 'Oswald', sans-serif; color:var(--accent); }
    .card-actions { display:flex; gap:8px; }
    .card-actions button { padding:8px 12px; font-size:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .grid .full { grid-column:1 / -1; }
    .photo-row { display:flex; gap:16px; align-items:flex-start; }
    .photo-preview { width:140px; height:105px; object-fit:cover; background:#100f0e; border:1px solid #4a453d; flex:none; }
    .photo-controls { flex:1; }
    .hint { font-size:11px; color:var(--muted); margin-top:6px; }

    .bar { position:sticky; bottom:0; background:rgba(20,19,17,.95); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:16px 0; margin-top:24px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .status { font-size:13px; }
    .ok { color:#8fd694; }
    .err { color:#ff8f6b; }
    .top-links { display:flex; gap:16px; font-size:12px; margin-bottom:24px; }
    .top-links a { color:var(--muted); }
    .add-row { display:flex; gap:12px; flex-wrap:wrap; }
    @media (max-width:640px) {
      .grid { grid-template-columns:1fr; }
      .photo-row { flex-direction:column; }
      .photo-preview { width:100%; height:180px; }
      .bar button { flex:1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Объекты в продаже</h1>
    <p class="sub">Здесь можно добавлять, менять и удалять квартиры. После сохранения они сразу появятся на сайте.</p>

    <section class="login" id="login">
      <label for="pass">Пароль</label>
      <input type="password" id="pass" autocomplete="current-password">
      <button id="login-btn">Войти</button>
      <p class="status err" id="login-error" hidden></p>
    </section>

    <section id="editor" hidden>
      <div class="top-links">
        <a href="index.html" target="_blank">Открыть сайт ↗</a>
        <a href="catalog.html" target="_blank">Открыть каталог ↗</a>
        <a href="#" id="logout">Выйти</a>
      </div>
      <div id="cards"></div>
      <div class="add-row">
        <button class="ghost" id="add">+ Добавить объект</button>
        <button class="ghost" id="import">Добавить объекты с Krisha из файла</button>
      </div>
      <div class="bar">
        <button id="save">Сохранить и опубликовать</button>
        <span class="status" id="status"></span>
      </div>
    </section>
  </div>

  <script>
  (() => {
    'use strict';
    const $ = s => document.querySelector(s);
    const KEY = 'aizhan-admin-pass';
    let items = [];
    let pass = sessionStorage.getItem(KEY) || '';

    const headers = () => ({ 'Content-Type': 'application/json', 'X-Admin-Password': pass });
    const empty = () => ({ title:'', district:'', rooms:'', area:'', floor:'', price:'', tag:'', image:'', url:'' });

    function cardHtml(l, i) {
      const esc = v => String(v == null ? '' : v).replace(/"/g, '&quot;').replace(/</g, '&lt;');
      return `<div class="card" data-i="${i}">
        <div class="card-top">
          <strong>${String(i + 1).padStart(2, '0')}</strong>
          <div class="card-actions">
            <button class="ghost" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="ghost" data-act="down" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="danger" data-act="del">Удалить</button>
          </div>
        </div>
        <div class="grid">
          <div class="full"><label>Ссылка на объявление (Krisha и т. д.)</label><input data-f="url" value="${esc(l.url)}" placeholder="https://krisha.kz/a/show/000000"></div>
          <div class="full">
            <label>Фото квартиры</label>
            <div class="photo-row">
              <img class="photo-preview" data-preview src="${esc(l.image)}" alt="">
              <div class="photo-controls">
                <input type="file" accept="image/*" data-file>
                <p class="hint">Можно выбрать фото прямо с телефона. Или вставить ссылку на фото ниже.</p>
                <input data-f="image" value="${esc(l.image)}" placeholder="Ссылка на фото">
              </div>
            </div>
          </div>
          <div><label>Заголовок</label><input data-f="title" value="${esc(l.title)}" placeholder="3-комнатная квартира"></div>
          <div><label>ЖК и район</label><input data-f="district" value="${esc(l.district)}" placeholder="ЖК «Алтын», Есильский р-н"></div>
          <div><label>Комнат</label><input data-f="rooms" value="${esc(l.rooms)}" placeholder="3"></div>
          <div><label>Площадь, м²</label><input data-f="area" value="${esc(l.area)}" placeholder="98"></div>
          <div><label>Этаж</label><input data-f="floor" value="${esc(l.floor)}" placeholder="7/12"></div>
          <div><label>Цена, ₸ (только цифры)</label><input data-f="price" value="${esc(l.price)}" inputmode="numeric" placeholder="89000000"></div>
          <div class="full"><label>Метка (можно оставить пустой)</label><input data-f="tag" value="${esc(l.tag)}" placeholder="НОВИНКА"></div>
        </div>
      </div>`;
    }

    function render() {
      $('#cards').innerHTML = items.map(cardHtml).join('');
    }

    function setStatus(text, cls) {
      const el = $('#status');
      el.textContent = text;
      el.className = 'status ' + (cls || '');
    }

    // Уменьшаем фото в браузере, чтобы снимок с телефона загрузился быстро
    function shrink(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Это не похоже на фото'));
          img.onload = () => {
            const max = 1600;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function load() {
      try {
        const data = await fetch('/api/listings', { cache: 'no-store' }).then(r => r.json());
        items = Array.isArray(data.listings) && data.listings.length ? data.listings : [empty()];
      } catch {
        items = [empty()];
      }
      render();
    }

    $('#login-btn').addEventListener('click', async () => {
      pass = $('#pass').value;
      if (!pass) return;
      const res = await fetch('/api/listings', { method: 'POST', headers: headers(), body: JSON.stringify({ verify: true }) });
      if (res.status === 401) {
        $('#login-error').textContent = 'Неверный пароль';
        $('#login-error').hidden = false;
        return;
      }
      sessionStorage.setItem(KEY, pass);
      $('#login').hidden = true;
      $('#editor').hidden = false;
      load();
    });

    $('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });

    $('#logout').addEventListener('click', e => {
      e.preventDefault();
      sessionStorage.removeItem(KEY);
      location.reload();
    });

    $('#add').addEventListener('click', () => { items.push(empty()); render(); window.scrollTo(0, document.body.scrollHeight); });

    // Подставляет объекты из config.js — те девять, что собраны с Krisha
    $('#import').addEventListener('click', () => {
      const fromFile = (window.REALTOR && window.REALTOR.listings) || [];
      if (!fromFile.length) { setStatus('В файле нет объектов', 'err'); return; }
      const have = new Set(items.map(l => l.url).filter(Boolean));
      const base = location.origin + '/';
      const added = fromFile
        .filter(l => !have.has(l.url))
        .map(l => ({ ...l, image: /^https?:/.test(l.image) ? l.image : base + l.image }));
      items = items.filter(l => l.title || l.url || l.image).concat(added);
      render();
      setStatus(`Добавлено объектов: ${added.length}. Проверьте и нажмите «Сохранить».`, 'ok');
    });

    $('#cards').addEventListener('input', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const i = Number(card.dataset.i);
      const field = e.target.dataset.f;
      if (field) {
        items[i][field] = e.target.value;
        if (field === 'image') card.querySelector('[data-preview]').src = e.target.value;
      }
    });

    $('#cards').addEventListener('change', async e => {
      if (!e.target.matches('[data-file]')) return;
      const card = e.target.closest('.card');
      const i = Number(card.dataset.i);
      const file = e.target.files[0];
      if (!file) return;
      setStatus('Загружаю фото…');
      try {
        const dataUrl = await shrink(file);
        const res = await fetch('/api/upload', { method: 'POST', headers: headers(), body: JSON.stringify({ file: dataUrl }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');
        items[i].image = data.url;
        card.querySelector('[data-preview]').src = data.url;
        card.querySelector('[data-f="image"]').value = data.url;
        setStatus('Фото загружено', 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      }
    });

    $('#cards').addEventListener('click', e => {
      const button = e.target.closest('[data-act]');
      if (!button) return;
      const i = Number(button.closest('.card').dataset.i);
      const act = button.dataset.act;
      if (act === 'del') { if (!confirm('Удалить этот объект?')) return; items.splice(i, 1); }
      if (act === 'up' && i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; }
      if (act === 'down' && i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; }
      render();
    });

    $('#save').addEventListener('click', async () => {
      const clean = items.filter(l => l.title || l.url || l.image);
      const broken = clean.find(l => !l.url || !l.image);
      if (broken) { setStatus('У каждого объекта нужны ссылка и фото', 'err'); return; }
      $('#save').disabled = true;
      setStatus('Сохраняю…');
      try {
        const res = await fetch('/api/listings', { method: 'POST', headers: headers(), body: JSON.stringify({ listings: clean }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка сохранения');
        items = clean.length ? clean : [empty()];
        render();
        setStatus('Сохранено. Объектов на сайте: ' + data.count, 'ok');
      } catch (err) {
        setStatus(err.message, 'err');
      } finally {
        $('#save').disabled = false;
      }
    });

    if (pass) { $('#login').hidden = true; $('#editor').hidden = false; load(); }
  })();
  </script>
</body>
</html>
